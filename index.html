/* --------- Помощники --------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const dmUrl = name => `https://t.me/${CONFIG.me}?text=${encodeURIComponent(CONFIG.message.replace("{name}", name))}`;
const dmPlain = () => `https://t.me/${CONFIG.me}?text=${encodeURIComponent("Здравствуйте, Марина! Хочу полный прогноз на " + CONFIG.year + " год")}`;

/* --------- Звёзды и матрица --------- */
(function decor() {
  let s = "";
  for (let i = 0; i < 46; i++) {
    const size = Math.random() < .2 ? 3 : 2;
    s += `<i class="${i % 5 ? "" : "g"}" style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;width:${size}px;height:${size}px;animation-delay:-${(Math.random() * 4).toFixed(1)}s"></i>`;
  }
  $("stars").innerHTML = s;

  const pts = [[165, 22, 3], [266, 64, 17], [308, 165, 21], [266, 266, 4], [165, 308, 9], [64, 266, 22], [22, 165, 11], [64, 64, 7]];
  $("matrix").innerHTML = `
    <g fill="none" stroke="rgba(241,212,138,.35)" stroke-width="1">
      <circle cx="165" cy="165" r="143" stroke-dasharray="2 6"/>
      <rect x="64" y="64" width="202" height="202"/>
      <polygon points="165,22 308,165 165,308 22,165"/>
      <path d="M165 22V308M22 165H308M64 64 266 266M266 64 64 266" stroke="rgba(255,255,255,.12)"/>
    </g>
    ${pts.map(([x, y, n]) => `<g class="dot"><circle cx="${x}" cy="${y}" r="14" fill="#1E3A78" stroke="#F1D48A" stroke-width="1"/>
      <text x="${x}" y="${y + 4.5}" text-anchor="middle" font-family="Forum, Georgia, serif" font-size="13" fill="#F1D48A">${n}</text></g>`).join("")}`;
})();

/* --------- Расчёт --------- */
const digitSum = n => String(n).split("").reduce((a, d) => a + +d, 0);
const toArcana = n => { while (n > 22) n = digitSum(n); return n; };
const yearEnergy = (day, month, year) => toArcana(toArcana(day) + month + toArcana(digitSum(year)));

function parseDate(str) {
  const m = str.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) return null;
  const [day, month, year] = [+m[1], +m[2], +m[3]];
  const d = new Date(year, month - 1, day);
  if (d.getDate() !== day || d.getMonth() !== month - 1 || year < 1920 || d > new Date()) return null;
  return { day, month, year };
}

// Точки в дате ставятся сами: 15031990 → 15.03.1990
$("dob").addEventListener("input", e => {
  const d = e.target.value.replace(/\D/g, "").slice(0, 8);
  e.target.value = d.length > 4 ? `${d.slice(0, 2)}.${d.slice(2, 4)}.${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}.${d.slice(2)}` : d;
});
$("dob").addEventListener("keydown", e => { if (e.key === "Enter") calculate(); });
$("go").addEventListener("click", calculate);

let busy = false;
function calculate() {
  if (busy) return;
  const date = parseDate($("dob").value.trim());
  if (!date) { $("error").textContent = "Проверь дату: нужно в виде 15.03.1990"; return; }
  $("error").textContent = "";
  $("dob").blur();
  const n = yearEnergy(date.day, date.month, CONFIG.year);
  try { localStorage.setItem("raschet-dob", $("dob").value); } catch (e) {}
  if (reduce) return show(n);

  // Матрица ускоряется, точки вспыхивают по кругу, в центре бегут числа — и останавливаются на результате
  busy = true;
  document.querySelector(".sky").scrollIntoView({ behavior: "smooth", block: "center" });
  $("hero").classList.add("counting");
  const dots = [...document.querySelectorAll(".matrix .dot")];
  let step = 0;
  const total = 22;
  (function tick() {
    dots.forEach((d, i) => d.classList.toggle("on", i === step % dots.length));
    $("core").textContent = (step % 22) + 1;
    step++;
    if (step < total) setTimeout(tick, 40 + step * 4);
    else {
      dots.forEach(d => d.classList.remove("on"));
      $("hero").classList.remove("counting");
      busy = false;
      show(n);
    }
  })();
}

function show(n) {
  const a = CONFIG.arcana[n - 1];
  const core = $("core");
  core.textContent = n;
  core.classList.remove("pop"); void core.offsetWidth; core.classList.add("pop");
  $("result").innerHTML = `
    <div class="res">
      <div class="res-sub">Твой ${CONFIG.year} год · число ${n}</div>
      <div class="res-name">${esc(a.name)}</div>
      <p class="res-theme">${esc(a.text)}</p>
      <div class="res-block"><div class="res-label">Деньги</div>${esc(a.money)}</div>
      <div class="res-block"><div class="res-label">Отношения</div>${esc(a.love)}</div>
      <a class="btn" href="${dmUrl(a.name)}" target="_blank" rel="noopener">Хочу полный прогноз на ${CONFIG.year}</a>
      <button class="share" id="share">Отправить подруге, пусть тоже посчитает</button>
    </div>`;
  $("share").addEventListener("click", share);
  renderBelow(a.name);
  setTimeout(() => $("result").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }), 250);
}

function share() {
  const text = `Посчитала свой ${CONFIG.year} год по дате рождения, попробуй тоже`;
  if (navigator.share) { navigator.share({ title: "Каким будет твой 2027 год", text, url: CONFIG.site }).catch(() => {}); return; }
  window.open(`https://t.me/share/url?url=${encodeURIComponent(CONFIG.site)}&text=${encodeURIComponent(text)}`, "_blank");
}

/* --------- Нижняя часть: закрытый прогноз, о Марине, отзывы --------- */
function renderBelow(name) {
  const dm = name ? dmUrl(name) : dmPlain();
  $("below").innerHTML = `
    <section>
      <h2>Что будет в <em>полном прогнозе</em></h2>
      <div class="locked">
        <div class="locked-top"><b>Прогноз на ${CONFIG.year} год</b><span class="price">${esc(CONFIG.price)}</span></div>
        ${CONFIG.teaser.map(t => `<div class="row"><span>${esc(t)}</span><i>расскажу лично</i></div>`).join("")}
        <p class="hook">${esc(CONFIG.hook)}</p>
        <a class="btn blue" href="${dm}" target="_blank" rel="noopener">Заказать прогноз в личке</a>
        <p class="how">Если сообщение не подставилось, просто напиши мне слово <b>${esc(CONFIG.word)}</b></p>
      </div>
    </section>

    <section>
      <div class="about">
        <img src="photo.webp" alt="Марина" onerror="this.src='photo.png'">
        <div><b>Марина, нумеролог</b><p>${esc(CONFIG.about)}</p></div>
      </div>
    </section>

    <section>
      <h2>Что пишут <em>после прогноза</em></h2>
      <div class="reviews">
        ${CONFIG.reviews.map(r => `<div class="review"><p>${esc(r.text)}</p>${r.shot ? `<button class="shot" data-shot="${esc(r.shot)}">Смотреть скрин</button>` : ""}</div>`).join("")}
      </div>
    </section>

    <section class="final">
      ${name ? `<a class="btn blue" href="${dm}" target="_blank" rel="noopener">Хочу полный прогноз на ${CONFIG.year}</a>` : `<p>Сначала посчитай свой год, это бесплатно</p><button class="btn soft" id="up">Рассчитать свой год ↑</button>`}
    </section>

    <footer>
      <p>Больше разборов и практик в <a href="${CONFIG.channel}" target="_blank" rel="noopener">канале Марины</a></p>
    </footer>`;
  const up = $("up");
  if (up) up.addEventListener("click", () => { $("hero").scrollIntoView({ behavior: "smooth" }); setTimeout(() => $("dob").focus(), 500); });
}

/* --------- Скрины отзывов на весь экран --------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-shot]");
  if (b) { $("viewer").querySelector("img").src = b.dataset.shot; $("viewer").classList.add("on"); return; }
  if (e.target.closest("#viewer")) $("viewer").classList.remove("on");
});

renderBelow("");
// Если человек уже считал, подставим его дату
try { const saved = localStorage.getItem("raschet-dob"); if (saved) $("dob").value = saved; } catch (e) {}
</script>
